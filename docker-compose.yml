services:
  # ── Redis — message broker and result backend ──────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # No host port — only accessible within the Docker network
    volumes:
      - redis-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Gradio Web UI ──────────────────────────────────────────────────────
  app:
    build: .
    command: python app.py
    # Port 7860 is only exposed within the Docker network (Caddy proxies it).
    # For local testing without Caddy, uncomment the line below:
    # ports:
    #   - "7860:7860"
    expose:
      - "7860"
    # Lets llm.base_url reach an Ollama server on the Docker host
    # (http://host.docker.internal:11434); see "AI models with Docker" in the README.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./fonts:/app/fonts:ro
      - output-data:/app/output
      - hf-cache:/app/.hf
    mem_limit: 6g
    read_only: true
    tmpfs:
      - /tmp:size=4g,uid=10001
      - /app/.cache:uid=10001
      - /usr/local/share/fonts:uid=10001
      - /var/cache/fontconfig:uid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - READREADY_HOST=0.0.0.0
      - READREADY_USER=${READREADY_USER:-}
      - READREADY_SECRET=${READREADY_SECRET:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/')"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── Celery Workers — process PDFs asynchronously ───────────────────────
  worker:
    build: .
    command: >
      celery -A tasks.celery_app:celery_app worker
      --loglevel=info
      --concurrency=1
      --pool=prefork
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./fonts:/app/fonts:ro
      - output-data:/app/output
      - hf-cache:/app/.hf
    read_only: true
    tmpfs:
      - /tmp:size=4g,uid=10001
      - /app/.cache:uid=10001
      - /usr/local/share/fonts:uid=10001
      - /var/cache/fontconfig:uid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis:
        condition: service_healthy
      # The app container fills the new hf-cache volume from the image; containers
      # mounting an empty volume at the same moment race and fail ("file exists").
      app:
        condition: service_started
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "celery -A tasks.celery_app:celery_app inspect ping --timeout=10 2>/dev/null | grep -q OK"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "5"
          memory: 10G
    restart: unless-stopped

  # # ── Flower — Celery monitoring dashboard, optional ───────────────────
  # # Flower has no login of its own: keep it on the internal network (expose,
  # # not ports) and put it behind the Caddy basic_auth block before enabling.
  # flower:
  #   build: .
  #   command: >
  #     celery -A tasks.celery_app:celery_app flower
  #     --port=5555
  #     --broker_api=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  #   expose:
  #     - "5555"
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   environment:
  #     - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  #   restart: unless-stopped

  # ── Caddy — reverse proxy (HTTPS needs the production block in the Caddyfile) ──
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
#      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      - app
#      - flower
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  redis-data:
  output-data:
  # Docling model cache. Filled from the image on first start (prefetched
  # models) or by downloads on first use (PREFETCH_MODELS=0). Remove it after
  # rebuilding the image with new models so it is refilled from the image.
  hf-cache:
  caddy-data:
  caddy-config:
