name: ci
on: [push, pull_request]
jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install vermin==1.9.1 && git ls-files '*.py' | xargs vermin -q --no-tips --violations -t=3.10- --eval-annotations
  python-tests:
    needs: java
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { python: ["3.10", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/download-artifact@v4
        with: { name: itext-tagger, path: output_gen/ }
      - run: mv output_gen/itext-tagger-1.0.0.jar output_gen/itext_tagger.jar && java -version
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2 poppler-utils tesseract-ocr fonts-dejavu-core fonts-liberation fonts-noto-core
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
      - run: python -m pytest tests/ -q
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - run: cd output_gen/itext_src && mvn -q -B package
      - uses: actions/upload-artifact@v7
        with: { name: itext-tagger, path: output_gen/itext_src/target/itext-tagger-1.0.0.jar }
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg PREFETCH_MODELS=0 -t readready:ci .
  publish:
    if: vars.PUBLISH_IMAGE == 'true' && startsWith(github.ref, 'refs/tags/')
    needs: [compat, python-tests, java, docker]
    runs-on: ubuntu-latest
    permissions: { packages: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: docker build -t ghcr.io/${{ github.repository }}:${{ github.ref_name }} . && docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}
