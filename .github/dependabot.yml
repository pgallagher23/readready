version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }
    # The docling family is pinned as a validated set (see requirements.txt);
    # bumping any one of them conflicts with the others.
    ignore:
      - dependency-name: "docling"
      - dependency-name: "docling-slim"
      - dependency-name: "docling-core"
      - dependency-name: "docling-parse"
      - dependency-name: "docling-ibm-models"
  - package-ecosystem: maven
    directory: "/output_gen/itext_src"
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
