# ── Fallback fix hints ────────────────────────────────────────────────
# Brief one-line hints for issue types not covered by a full entry above,
# or overrides for specific keys within a multi-key entry.

fix_hints:
  invalid-document-language: "Use a valid BCP 47 language tag (e.g., 'en', 'es', 'fr')."
  missing-form-instructions: Add clear instructions for completing the form.
  pdf-not-marked: Set /MarkInfo.Marked to true in the PDF catalog.
  pdf-no-document-lang: Set the /Lang entry in the PDF document catalog.
  pdf-figures-missing-alt: Add /Alt entries to Figure structure elements in the PDF.
  pdf-blank-subtrees: Remove empty subtrees from the structure tree.
  ambiguous-link: "Replace generic text ('click here', 'read more') with a descriptive label."
  table-no-caption: "Add a caption describing the table's purpose."
  table-missing-caption: "Add a caption describing the table's purpose."
  table-missing-summary: Add a summary attribute or caption for complex tables.
  # Table header structure
  table-irregular-headers: "Table has inconsistent header cells — mark all header cells as TH with correct scope."
  table-irregular-columns: "Table rows have inconsistent column counts — check for missing cells or incorrect colspan values."
  table-missing-headers-id: "Complex table cells are not associated with their headers — add headers/id attributes."
  table-missing-scope: "Table header cells are missing scope attributes — set scope to Row, Column, or Both."
  table-missing-thead: "Table header rows should be grouped in a thead element."
  table-missing-tbody: "Table data rows should be grouped in a tbody element."
  # Formula descriptions
  formula-missing-alt-text: "Formula has no text description — add alt text that describes the formula."
  formula-generic-alt-text: "Formula has a generic placeholder description — replace with specific content."
  formula-missing-description: "Formula has MathML markup but no text fallback — add an alttext or aria-label."
  # Alt text variants
  generic-alt-text: "Replace generic alt text ('image', 'photo') with a description of the image content."
  empty-alt-text: "Image has empty alt text but is not decorative — add a meaningful description."
  # Title variants
  empty-title: "The document title is empty — enter a descriptive title."
  generic-title: "Replace the generic title with a specific, descriptive document title."
  missing-title: "Set a descriptive document title in File → Properties → Description."
  # Heading variants
  empty-heading: "Heading element has no text — add descriptive text or remove the empty heading."
  generic-heading: "Heading uses placeholder text — replace with a meaningful section label."
  no-headings: "Document has no headings — add at least an H1 and H2s for sections."
  # Link variants
  url-as-link-text: "Replace the raw URL with descriptive text that explains the link destination."
  duplicate-link-text-different-url: "Links with the same text go to different destinations — make each link text unique."
  # Figure caption variants
  empty-figure-caption: "The figure has a caption element but it is empty — add descriptive caption text."
  missing-figure-caption: "Add a caption that summarizes the figure content."
